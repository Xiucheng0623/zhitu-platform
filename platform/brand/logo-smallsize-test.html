<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>海荣广贸 · 小尺寸对抗测试</title>
<style>
  body{margin:0;background:#14161A;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  .row{display:flex;align-items:center;gap:34px;padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.06)}
  .tag{width:190px;color:#9AA0A9;font-size:11px;letter-spacing:.06em}
  .box{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
  .box24{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
  .box32{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
  .c{color:#FAF9F7}
</style>
</head>
<body>

<!-- D 双帆·实心单色 + 铜水线 -->
<div class="row">
  <div class="tag">D 双帆·单色 + 铜水线</div>
  <div class="box"><svg width="44" height="44" viewBox="0 0 64 64" class="c">
    <path d="M9 49 L9 28 C15 31 20 40 23 49 Z" fill="currentColor"/>
    <path d="M55 49 L55 8 C45 18 37 37 32 49 Z" fill="currentColor"/>
    <path d="M7 53.5 H57" stroke="#B4652E" stroke-width="3.4" stroke-linecap="round"/>
  </svg></div>
  <div class="box32"><svg width="32" height="32" viewBox="0 0 64 64" class="c">
    <path d="M9 49 L9 28 C15 31 20 40 23 49 Z" fill="currentColor"/>
    <path d="M55 49 L55 8 C45 18 37 37 32 49 Z" fill="currentColor"/>
    <path d="M7 53.5 H57" stroke="#B4652E" stroke-width="3.4" stroke-linecap="round"/>
  </svg></div>
  <div class="box24"><svg width="24" height="24" viewBox="0 0 64 64" class="c">
    <path d="M9 49 L9 28 C15 31 20 40 23 49 Z" fill="currentColor"/>
    <path d="M55 49 L55 8 C45 18 37 37 32 49 Z" fill="currentColor"/>
    <path d="M7 53.5 H57" stroke="#B4652E" stroke-width="3.4" stroke-linecap="round"/>
  </svg></div>
</div>

<!-- H 单帆 -->
<div class="row">
  <div class="tag">H 单帆</div>
  <div class="box"><svg width="44" height="44" viewBox="0 0 64 64" class="c">
    <path d="M53 8 C43 18 31 38 26 51 L53 51 Z" fill="currentColor"/>
    <path d="M9 51 L9 16" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
    <path d="M6 55 H58" stroke="#B4652E" stroke-width="3.4" stroke-linecap="round"/>
  </svg></div>
  <div class="box32"><svg width="32" height="32" viewBox="0 0 64 64" class="c">
    <path d="M53 8 C43 18 31 38 26 51 L53 51 Z" fill="currentColor"/>
    <path d="M9 51 L9 16" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
    <path d="M6 55 H58" stroke="#B4652E" stroke-width="3.4" stroke-linecap="round"/>
  </svg></div>
  <div class="box24"><svg width="24" height="24" viewBox="0 0 64 64" class="c">
    <path d="M53 8 C43 18 31 38 26 51 L53 51 Z" fill="currentColor"/>
    <path d="M9 51 L9 16" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
    <path d="M6 55 H58" stroke="#B4652E" stroke-width="3.4" stroke-linecap="round"/>
  </svg></div>
</div>

<!-- E 粗 H 波杠 -->
<div class="row">
  <div class="tag">E 粗 H · 波杠</div>
  <div class="box"><svg width="44" height="44" viewBox="0 0 64 64" class="c">
    <path d="M15 52 V12" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
    <path d="M49 52 V12" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
    <path d="M15 35 C26 28 36 41 49 30" stroke="#B4652E" stroke-width="9" stroke-linecap="round" fill="none"/>
  </svg></div>
  <div class="box32"><svg width="32" height="32" viewBox="0 0 64 64" class="c">
    <path d="M15 52 V12" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
    <path d="M49 52 V12" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
    <path d="M15 35 C26 28 36 41 49 30" stroke="#B4652E" stroke-width="9" stroke-linecap="round" fill="none"/>
  </svg></div>
  <div class="box24"><svg width="24" height="24" viewBox="0 0 64 64" class="c">
    <path d="M15 52 V12" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
    <path d="M49 52 V12" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
    <path d="M15 35 C26 28 36 41 49 30" stroke="#B4652E" stroke-width="9" stroke-linecap="round" fill="none"/>
  </svg></div>
</div>

<!-- F 三道潮线 -->
<div class="row">
  <div class="tag">F 三道潮线</div>
  <div class="box"><svg width="44" height="44" viewBox="0 0 64 64" class="c">
    <path d="M10 44 H40" stroke="currentColor" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    <path d="M10 32 H48" stroke="currentColor" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    <path d="M10 20 H56" stroke="#B4652E" stroke-width="7" stroke-linecap="round"/>
  </svg></div>
  <div class="box32"><svg width="32" height="32" viewBox="0 0 64 64" class="c">
    <path d="M10 44 H40" stroke="currentColor" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    <path d="M10 32 H48" stroke="currentColor" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    <path d="M10 20 H56" stroke="#B4652E" stroke-width="7" stroke-linecap="round"/>
  </svg></div>
  <div class="box24"><svg width="24" height="24" viewBox="0 0 64 64" class="c">
    <path d="M10 44 H40" stroke="currentColor" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    <path d="M10 32 H48" stroke="currentColor" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    <path d="M10 20 H56" stroke="#B4652E" stroke-width="7" stroke-linecap="round"/>
  </svg></div>
</div>

</body>
</html>
